# ==========================================
# Skill: 灾害变化描述
# ==========================================
name: disaster_change_description
description: "By comparing the remote sensing images before and after the disaster, identify the changes in ground objects and generate a disaster caption."

# ==================== 感知阶段 ====================
perception:
  # 开放词汇分割的概念词表
  concepts:
    - forest or vegetation
    - water body
    - farmland
    - road

  # 演化边构建参数
  evolution_min_iou: 0.3
  evolution_top_k: 1

# ==================== 证据检索阶段 ====================
evidence:
  # 三大证据开关（可单独关闭）
  enable_experience: false     # 经验证据（离线 embedding 检索）
  enable_grounding: true      # 视觉定位证据（在线生成标注图）
  enable_changing: true       # 语义变化证据（在线推理 + 验证）

  # 经验证据 - RAG 检索配置
  rag:
    api_url: "http://localhost:8008"  # RAG 服务地址
    top_k: 3                          # 返回案例数
    timeout: 30                       # 超时时间(秒)

  # 语义变化证据 - 推理与验证配置
  semantic_change:
    max_claims: 10                    # 最大声称数量
    confidence_threshold: 0.7         # 验证置信度阈值

# ==================== 生成阶段 ====================
# 单阶段输出：只生成灾害描述
generation:
  output_stages:
    - name: caption
      prompt_section: "generation"    # 使用 prompt.md 中的 # Generation section
      experience_fields:
        include_description: false
        include_advice: false         # 该任务不需要恢复建议
      output_key: "caption"
