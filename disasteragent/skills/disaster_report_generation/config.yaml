# ==========================================
# Skill: 灾害报告生成
# ==========================================
name: disaster_report_generation
description: "Generate a comprehensive disaster report including: (1) disaster impact assessment on buildings, roads, vegetation, water bodies, and agriculture; (2) recovery recommendations with immediate actions, short-term recovery, and long-term reconstruction plans."

# ==================== 感知阶段 ====================
perception:
  # 开放词汇分割的概念词表
  concepts:
    - forest or vegetation
    - water body
    - farmland

  # 演化边构建参数
  evolution_min_iou: 0.3
  evolution_top_k: 1

# ==================== 证据检索阶段 ====================
evidence:
  # 三大证据开关（可单独关闭）
  enable_experience: true     # 经验证据（离线 embedding 检索）
  enable_grounding: true      # 视觉定位证据（在线生成标注图）
  enable_changing: true       # 语义变化证据（在线推理 + 验证）

  # 经验证据 - RAG 检索配置
  rag:
    api_url: "http://localhost:8008"  # RAG 服务地址
    top_k: 3                          # 返回案例数
    timeout: 30                       # 超时时间(秒)

  # 语义变化证据 - 推理与验证配置
  semantic_change:
    max_claims: 10                    # 最大声称数量
    confidence_threshold: 0.7         # 验证置信度阈值

# ==================== 生成阶段 ====================
# 多阶段输出：每个 stage 独立生成，可配置不同的 prompt 和经验证据字段
generation:
  output_stages:
    - name: disaster_description
      prompt_section: "generation - description"   # prompt.md 中的一级标题（小写匹配）
      experience_fields:
        include_description: true    # 使用历史案例的灾害描述
        include_advice: false
      output_key: "description"      # 保存到 state 中的 key

    - name: recovery_advice
      prompt_section: "generation - advice"
      experience_fields:
        include_description: false
        include_advice: true         # 使用历史案例的恢复建议
      output_key: "advice"
    
